name: Laravel 12 CI + SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour l'analyse SonarCloud (historique complet)

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, intl, zip, sqlite3, pdo_mysql
          coverage: xdebug

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (Vite)
        run: |
          npm ci
          npm run build

      - name: Run database migrations (SQLite)
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run tests with Pest and generate coverage
        env:
          APP_ENV: testing
          APP_URL: http://localhost
        run: |
          ./vendor/bin/pest --coverage-clover=coverage.xml

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=THYLTECH_Ticketack
            -Dsonar.organization=thyltech
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=vendor/**,database/**,bootstrap/**,storage/**,public/**
