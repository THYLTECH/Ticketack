name: Deploy to VPS

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/ticketack
            git fetch origin develop
            git reset --hard origin/develop
            git config --global --add safe.directory /var/www/ticketack
            docker compose up -d --build --force-recreate app
            sleep 5
            docker compose exec -T app composer install --optimize-autoloader --no-dev
            docker compose exec -T app npm install
            docker compose exec -T app npm run build
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app chown -R www-data:www-data /var/www/ticketack/storage /var/www/ticketack/bootstrap/cache
